name: Offline Agent Evaluations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  routing-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline golden-case evaluation
        run: python evals/evaluate_fallback.py --min-accuracy 1.0
      - name: Routing unit tests
        run: python -m unittest discover -s tests -p test_fallback_router.py -v
